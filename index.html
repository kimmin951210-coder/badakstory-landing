<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>바닥이야기</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RH05XYE84B"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-RH05XYE84B');

    function trackClick(eventName, buttonName, linkUrl) {
      gtag('event', eventName, {
        event_category: 'landing_button',
        button_name: buttonName,
        link_url: linkUrl,
        transport_type: 'beacon'
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    .wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 클릭 영역 공통 */
    .click-zone {
      position: absolute;
      left: 6.2%;
      width: 87.6%;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* 1. 생방송 공지방 */
    .zone1 {
      top: 36.8%;
      height: 11.3%;
    }

    /* 2. 카카오톡 문의 */
    .zone2 {
      top: 49.2%;
      height: 11.3%;
    }

    /* 3. 텔레그램 문의 */
    .zone3 {
      top: 61.5%;
      height: 11.3%;
    }

    /* 4. 바닥이야기 가족방 */
    .zone4 {
      top: 73.9%;
      height: 11.3%;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- 랜딩 이미지 -->
    <img
      src="./landing.png"
      alt="바닥이야기 랜딩페이지"
    />

    <!-- 1. 생방송 공지방 -->
    <a
      class="click-zone zone1"
      href="https://open.kakao.com/o/g1nwC04h"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="생방송 공지방"
      onclick="trackClick(
        'broadcast_notice_click',
        '생방송 공지방',
        this.href
      )">
    </a>

    <!-- 2. 카카오톡 문의 -->
    <a
      class="click-zone zone2"
      href="https://open.kakao.com/o/s266v8Ag"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="카카오톡 문의"
      onclick="trackClick(
        'kakao_click',
        '카카오톡 문의',
        this.href
      )">
    </a>

    <!-- 3. 텔레그램 문의 -->
    <a
      class="click-zone zone3"
      href="https://telegram.me/storyinquiry"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="텔레그램 문의"
      onclick="trackClick(
        'telegram_click',
        '텔레그램 문의',
        this.href
      )">
    </a>

    <!-- 4. 바닥이야기 가족방 -->
    <a
      class="click-zone zone4"
      href="https://open.kakao.com/o/gJqGHqLi"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="바닥이야기 가족방"
      onclick="trackClick(
        'family_room_click',
        '바닥이야기 가족방',
        this.href
      )">
    </a>

  </div>

</body>
</html>
